<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostic Signature Électronique – Administrations publiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;0,800;1,300&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- jsPDF — génération PDF côté client, sans window.print(), compatible iFrame cross-origin -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --navy: #0d1f3c;
    --navy-light: #152c52;
    --brand: #4680F7;
    --brand-light: #6b9aff;
    --gold: #e8a020;
    --gold-light: #f5c45a;
    --cream: #f7f4ef;
    --cream-dark: #ede8df;
    --text: #1a1a2e;
    --text-muted: #5a637a;
    --white: #ffffff;
    --red: #dc2626;
    --orange: #ea580c;
    --green: #16a34a;
    --radius: 16px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(13,31,60,0.12);
    --shadow-lg: 0 12px 48px rgba(13,31,60,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--navy);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-pattern {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 20% 20%, rgba(70,128,247,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 80%, rgba(232,160,32,0.12) 0%, transparent 60%),
      var(--navy);
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  .app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 16px 60px; }

  .topbar {
    width: 100%; max-width: 860px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 0 32px;
  }
  .logo svg { display: block; height: 40px; width: auto; fill: none; }
  .badge-secure {
    font-size: 11px; color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.15);
    padding: 4px 12px; border-radius: 20px; letter-spacing: 0.5px;
    font-family: 'Montserrat', sans-serif;
  }

  .card {
    width: 100%; max-width: 860px;
    background: var(--cream);
    border-radius: 24px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .progress-bar-wrap { height: 5px; background: var(--cream-dark); position: relative; }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--brand), var(--gold));
    transition: width 0.6s cubic-bezier(0.22,1,0.36,1);
    border-radius: 0 3px 3px 0;
  }

  .module-label {
    display: flex; align-items: center; gap: 10px;
    padding: 20px 36px 0;
    font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--text-muted);
    font-family: 'Montserrat', sans-serif;
  }
  .module-dot { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--gold)); }

  .q-body { padding: 24px 36px 36px; }
  .q-number { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-bottom: 8px; font-family: 'Montserrat', sans-serif; }
  .q-title { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 22px; line-height: 1.4; color: var(--navy); margin-bottom: 8px; }
  .q-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; line-height: 1.6; font-family: 'Montserrat', sans-serif; }

  .scenario-box {
    background: var(--navy); color: white; border-radius: 12px;
    padding: 20px 24px; margin-bottom: 24px; position: relative; overflow: hidden;
  }
  .scenario-box::before {
    content: '"'; font-family: 'Montserrat', sans-serif; font-size: 80px; color: var(--brand-light);
    opacity: 0.2; position: absolute; top: -10px; left: 16px; line-height: 1;
  }
  .scenario-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--brand-light); margin-bottom: 8px; font-weight: 600; }
  .scenario-text { font-size: 14px; line-height: 1.7; color: rgba(255,255,255,0.85); font-family: 'Montserrat', sans-serif; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 16px 20px; border-radius: 12px;
    background: white; border: 2px solid transparent;
    cursor: pointer; transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(13,31,60,0.06);
  }
  .option:hover { border-color: var(--brand-light); transform: translateX(4px); }
  .option.selected { border-color: var(--brand); background: #eef3ff; }
  .option-key {
    width: 28px; height: 28px; min-width: 28px; border-radius: 8px;
    background: var(--cream-dark); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--text-muted);
    transition: all 0.2s; font-family: 'Montserrat', sans-serif;
  }
  .option.selected .option-key { background: var(--brand); color: white; }
  .option-content { flex: 1; }
  .option-text { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.5; font-family: 'Montserrat', sans-serif; }
  .option-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; font-family: 'Montserrat', sans-serif; }

  .multi-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; font-style: italic; font-family: 'Montserrat', sans-serif; }

  .info-tip {
    margin-top: 20px; padding: 14px 18px;
    background: linear-gradient(135deg, rgba(70,128,247,0.08), rgba(232,160,32,0.06));
    border-left: 3px solid var(--brand); border-radius: 0 8px 8px 0;
    font-size: 13px; color: var(--text-muted); line-height: 1.6;
    font-family: 'Montserrat', sans-serif;
  }
  .info-tip strong { color: var(--navy); }

  .q-nav {
    padding: 0 36px 32px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .btn {
    padding: 12px 28px; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; border: none; transition: all 0.2s ease; font-family: 'Montserrat', sans-serif;
  }
  .btn-primary { background: var(--navy); color: white; box-shadow: 0 4px 16px rgba(13,31,60,0.2); }
  .btn-primary:hover { background: var(--navy-light); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(13,31,60,0.3); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-secondary { background: transparent; color: var(--text-muted); }
  .btn-secondary:hover { color: var(--navy); }
  .step-counter { font-size: 13px; color: var(--text-muted); font-family: 'Montserrat', sans-serif; }

  /* ── Cover ── */
  .cover { padding: 48px 36px 40px; }
  .cover-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700;
    color: var(--brand); margin-bottom: 20px;
    background: rgba(70,128,247,0.08); padding: 6px 14px; border-radius: 20px;
    font-family: 'Montserrat', sans-serif;
  }
  .cover-title { font-family: 'Montserrat', sans-serif; font-size: 32px; font-weight: 800; color: var(--navy); line-height: 1.2; margin-bottom: 16px; }
  .cover-title em { font-style: italic; color: var(--brand); }
  .cover-lead { font-size: 16px; color: var(--text-muted); line-height: 1.7; margin-bottom: 32px; max-width: 100%; font-family: 'Montserrat', sans-serif; }
  .version-selector { margin-bottom: 32px; }
  .version-title { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.8px; font-family: 'Montserrat', sans-serif; }
  .version-cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .ver-card { flex: 1; min-width: 160px; padding: 16px; border-radius: 12px; background: white; border: 2px solid var(--cream-dark); cursor: pointer; transition: all 0.2s; text-align: center; }
  .ver-card:hover { border-color: var(--brand-light); }
  .ver-card.active { border-color: var(--brand); background: #eef3ff; }
  .ver-icon { font-size: 24px; margin-bottom: 6px; }
  .ver-name { font-weight: 700; font-size: 14px; color: var(--navy); font-family: 'Montserrat', sans-serif; }
  .ver-time { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-family: 'Montserrat', sans-serif; }
  .cover-disclaimer { font-size: 12px; color: var(--text-muted); margin-top: 20px; font-family: 'Montserrat', sans-serif; }

  /* ── Lead Capture Interstitiel ── */
  .lead-capture { padding: 48px 36px 40px; }
  .lc-progress-hint {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-muted); margin-bottom: 28px;
    font-family: 'Montserrat', sans-serif;
  }
  .lc-progress-step {
    padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
    font-family: 'Montserrat', sans-serif;
  }
  .lc-progress-step.done { background: rgba(22,163,74,0.12); color: var(--green); }
  .lc-progress-step.active { background: rgba(70,128,247,0.12); color: var(--brand); }
  .lc-progress-step.next { background: var(--cream-dark); color: var(--text-muted); }
  .lc-progress-arrow { color: var(--text-muted); font-size: 12px; }
  .lc-header { margin-bottom: 28px; }
  .lc-eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700;
    color: var(--brand); margin-bottom: 14px;
    background: rgba(70,128,247,0.08); padding: 5px 12px; border-radius: 20px;
    font-family: 'Montserrat', sans-serif;
  }
  .lc-title { font-family: 'Montserrat', sans-serif; font-size: 26px; font-weight: 800; color: var(--navy); line-height: 1.3; margin-bottom: 10px; }
  .lc-subtitle { font-size: 14px; color: var(--text-muted); line-height: 1.6; font-family: 'Montserrat', sans-serif; }
  .lc-optional-badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    color: var(--text-muted); background: var(--cream-dark);
    padding: 3px 10px; border-radius: 20px; margin-left: 8px;
    font-family: 'Montserrat', sans-serif; vertical-align: middle;
  }
  .lc-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .lc-field { display: flex; flex-direction: column; gap: 5px; }
  .lc-field.full { grid-column: 1 / -1; }
  .lc-field.span2 { grid-column: 1 / -1; }
  .lc-field label {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .lc-field input, .lc-field select {
    padding: 10px 14px; border-radius: 10px;
    border: 1.5px solid var(--cream-dark);
    background: white; color: var(--text);
    font-size: 14px; font-family: 'Montserrat', sans-serif;
    transition: border-color 0.2s;
    outline: none;
  }
  .lc-field input:focus, .lc-field select:focus { border-color: var(--brand); }
  .lc-field input::placeholder { color: #b0b8c8; }
  .lc-consents { display: flex; flex-direction: column; gap: 8px; margin: 20px 0 0; }
  .lc-consent {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 11px 14px; border-radius: 10px;
    background: white; border: 1.5px solid var(--cream-dark);
    transition: border-color 0.2s;
  }
  .lc-consent:has(input:checked) { border-color: var(--brand); }
  .lc-consent input[type="checkbox"] {
    width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0;
    accent-color: var(--brand); cursor: pointer;
  }
  .lc-consent label {
    font-size: 13px; color: var(--text); line-height: 1.5;
    font-family: 'Montserrat', sans-serif; cursor: pointer;
  }
  .lc-consent label .lc-consent-required {
    font-size: 11px; font-weight: 600; color: var(--brand); margin-left: 4px;
  }
  .lc-consent label .lc-consent-opt {
    font-size: 11px; color: var(--text-muted); margin-left: 4px;
  }
  .lc-rgpd-clause {
    margin-top: 14px; font-size: 11px; color: var(--text-muted);
    line-height: 1.6; font-family: 'Montserrat', sans-serif;
    border-top: 1px solid var(--cream-dark); padding-top: 12px;
  }
  .lc-rgpd-clause a { color: var(--text-muted); text-decoration: underline; }
  .lc-actions { display: flex; align-items: center; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
  .btn-lc-submit {
    padding: 13px 32px; border-radius: 10px; font-size: 14px; font-weight: 700;
    cursor: pointer; border: none; font-family: 'Montserrat', sans-serif;
    background: var(--navy); color: white;
    box-shadow: 0 4px 16px rgba(13,31,60,0.2);
    transition: all 0.2s ease;
  }
  .btn-lc-submit:hover { background: var(--navy-light); transform: translateY(-1px); }
  .btn-lc-submit:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-lc-skip {
    background: none; border: none; font-family: 'Montserrat', sans-serif;
    font-size: 13px; color: var(--text-muted); cursor: pointer;
    text-decoration: underline; padding: 0;
  }
  .btn-lc-skip:hover { color: var(--text); }
  .lc-rgpd-note {
    margin-top: 20px; padding: 12px 16px;
    background: white; border-radius: 10px;
    border-left: 3px solid var(--cream-dark);
    font-size: 12px; color: var(--text-muted); line-height: 1.6;
    font-family: 'Montserrat', sans-serif;
  }
  .lc-rgpd-note strong { color: var(--text); }
  .lc-sending { text-align: center; padding: 20px 0; }
  .lc-sending-spinner {
    width: 32px; height: 32px; border: 3px solid var(--cream-dark);
    border-top-color: var(--brand); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lc-error {
    margin-top: 12px; padding: 10px 14px; border-radius: 8px;
    background: #fef2f2; color: var(--red); font-size: 13px;
    font-family: 'Montserrat', sans-serif; display: none;
  }

  /* ── Result ── */
  .result { padding: 40px 36px; }
  .result-header { text-align: center; margin-bottom: 40px; }
  .result-level {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    padding: 8px 20px; border-radius: 20px; margin-bottom: 20px;
    font-family: 'Montserrat', sans-serif;
  }
  .level-red { background: #fef2f2; color: var(--red); }
  .level-orange { background: #fff7ed; color: var(--orange); }
  .level-green { background: #f0fdf4; color: var(--green); }
  .result-title { font-family: 'Montserrat', sans-serif; font-size: 30px; font-weight: 800; color: var(--navy); margin-bottom: 12px; line-height: 1.3; }
  .result-subtitle { font-size: 15px; color: var(--text-muted); line-height: 1.7; max-width: 560px; margin: 0 auto; font-family: 'Montserrat', sans-serif; }

  .score-ring-wrap { display: flex; justify-content: center; margin: 32px 0; }
  .score-ring {
    width: 140px; height: 140px; border-radius: 50%;
    background: conic-gradient(var(--score-color, var(--brand)) var(--score-pct, 0deg), var(--cream-dark) 0deg);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .score-ring::after {
    content: ''; position: absolute; width: 104px; height: 104px;
    background: var(--cream); border-radius: 50%;
  }
  .score-value { position: relative; z-index: 1; text-align: center; }
  .score-num { font-family: 'Montserrat', sans-serif; font-size: 36px; font-weight: 800; color: var(--navy); line-height: 1; }
  .score-max { font-size: 12px; color: var(--text-muted); font-family: 'Montserrat', sans-serif; }

  .modules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 32px 0; }
  @media(max-width:600px){ .modules-grid { grid-template-columns: 1fr; } }
  .mod-result { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(13,31,60,0.07); }
  .mod-result-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; font-family: 'Montserrat', sans-serif; }
  .mod-result-name { font-weight: 700; font-size: 15px; color: var(--navy); margin-bottom: 12px; font-family: 'Montserrat', sans-serif; }
  .mod-bar { height: 6px; background: var(--cream-dark); border-radius: 3px; overflow: hidden; }
  .mod-bar-fill { height: 100%; border-radius: 3px; transition: width 1s cubic-bezier(0.22,1,0.36,1); }
  .mod-score-text { font-size: 12px; color: var(--text-muted); margin-top: 6px; font-family: 'Montserrat', sans-serif; }

  .reco-section { margin: 32px 0; }
  .reco-title { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 600; color: var(--navy); margin-bottom: 20px; }
  .reco-list { display: flex; flex-direction: column; gap: 12px; }
  .reco-item { display: flex; gap: 14px; align-items: flex-start; background: white; border-radius: 12px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(13,31,60,0.06); }
  .reco-icon { font-size: 20px; min-width: 24px; margin-top: 1px; }
  .reco-text { font-size: 14px; color: var(--text); line-height: 1.6; font-weight: 500; font-family: 'Montserrat', sans-serif; }
  .reco-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; font-family: 'Montserrat', sans-serif; }

  .cta-block {
    background: var(--navy); border-radius: 16px; padding: 32px;
    margin: 32px 0; color: white; position: relative; overflow: hidden;
  }
  .cta-block::after {
    content: ''; position: absolute; right: -30px; top: -30px;
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(70,128,247,0.2), transparent);
  }
  .cta-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--brand-light); margin-bottom: 12px; font-weight: 600; font-family: 'Montserrat', sans-serif; }
  .cta-title { font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 600; margin-bottom: 12px; line-height: 1.3; }
  .cta-text { font-size: 14px; color: rgba(255,255,255,0.75); line-height: 1.7; margin-bottom: 24px; max-width: 480px; font-family: 'Montserrat', sans-serif; }
  .cta-features { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .cta-feat { display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgba(255,255,255,0.85); font-family: 'Montserrat', sans-serif; }
  .cta-feat-check { color: var(--brand-light); font-weight: 700; }
  .cta-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--navy);
    font-weight: 700; padding: 12px 24px; border-radius: 10px; font-size: 14px;
    cursor: pointer; border: none; font-family: 'Montserrat', sans-serif;
    transition: all 0.2s; text-decoration: none; display: inline-block;
  }
  .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232,160,32,0.3); }
  .btn-outline-white {
    background: transparent; color: white; border: 1.5px solid rgba(255,255,255,0.3);
    padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'Montserrat', sans-serif;
    transition: all 0.2s; text-decoration: none; display: inline-block;
  }
  .btn-outline-white:hover { border-color: white; background: rgba(255,255,255,0.05); }

  /* ── Bouton PDF ── */
  .btn-pdf {
    display: inline-flex; align-items: center; gap: 8px;
    background: transparent; color: rgba(255,255,255,0.85);
    border: 1.5px solid rgba(255,255,255,0.3);
    padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'Montserrat', sans-serif;
    transition: all 0.2s; text-decoration: none;
  }
  .btn-pdf:hover { border-color: white; background: rgba(255,255,255,0.07); }
  .btn-pdf:disabled { opacity: 0.5; cursor: not-allowed; }

  .demo-section { margin-top: 28px; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 24px; }
  .demo-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--brand-light); font-weight: 600; font-family: 'Montserrat', sans-serif; margin-bottom: 16px; }
  .commercial-cards { display: flex; gap: 14px; flex-wrap: wrap; }
  .commercial-card {
    flex: 1; min-width: 220px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px;
    transition: all 0.2s;
  }
  .commercial-card:hover { background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.25); transform: translateY(-2px); }
  .commercial-info { display: flex; align-items: center; gap: 14px; }
  .commercial-photo { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2.5px solid rgba(70,128,247,0.5); flex-shrink: 0; }
  .commercial-name { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 15px; color: white; margin-bottom: 2px; }
  .commercial-title { font-size: 11px; color: var(--brand-light); font-weight: 600; font-family: 'Montserrat', sans-serif; }
  .commercial-territory { font-size: 12px; color: rgba(255,255,255,0.6); font-family: 'Montserrat', sans-serif; line-height: 1.5; display: flex; gap: 7px; align-items: flex-start; }
  .commercial-territory::before { content: '📍'; font-size: 13px; flex-shrink: 0; }
  .btn-demo-contact {
    display: block; text-align: center; background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--navy); font-weight: 700; padding: 10px 16px; border-radius: 8px;
    font-size: 13px; font-family: 'Montserrat', sans-serif; text-decoration: none;
    transition: all 0.2s; border: none; cursor: pointer; width: 100%;
  }
  .btn-demo-contact:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(232,160,32,0.35); }
  .result-restart { text-align: center; margin-top: 24px; }
  .btn-text { background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; text-decoration: underline; font-family: 'Montserrat', sans-serif; }

  /* Bandeau de confirmation post-soumission */
  .lc-confirmation-banner {
    display: flex; align-items: center; gap: 12px;
    background: rgba(22,163,74,0.08); border: 1.5px solid rgba(22,163,74,0.25);
    border-radius: 12px; padding: 14px 20px; margin-bottom: 28px;
    font-size: 13px; color: var(--green); font-family: 'Montserrat', sans-serif;
  }

  .legal-strip {
    margin-top: 40px; font-size: 11px; color: rgba(255,255,255,0.3);
    text-align: center; line-height: 1.8; font-family: 'Montserrat', sans-serif;
  }
  .legal-strip a { color: rgba(255,255,255,0.4); }

  @media(max-width: 640px){
    .cover, .lead-capture { padding: 32px 20px 28px; }
    .q-body { padding: 20px 20px 28px; }
    .q-nav { padding: 0 20px 24px; }
    .module-label { padding: 16px 20px 0; }
    .cover-title, .lc-title { font-size: 22px; }
    .q-title { font-size: 18px; }
    .result { padding: 28px 20px; }
    .cta-block { padding: 24px 20px; }
    .lc-form-grid { grid-template-columns: 1fr; }
  }
</style>

// ══════════════════════════════════════════════════
// HELPERS SCORE
// ══════════════════════════════════════════════════
function getQList()    { return VERSIONS[state.version].qIds; }
function totalQ()      { return getQList().length; }
function currentQId()  { return getQList()[state.currentQIdx]; }

function computeScore() {
  let total = 0, maxTotal = 0;
  const modScores = { A:{s:0,m:0}, B:{s:0,m:0}, C:{s:0,m:0}, D:{s:0,m:0} };
  getQList().forEach(qId => {
    const q = QUESTIONS[qId];
    const answered = state.answers[qId] || [];
    let qScore = 0;
    if (q.type === 'single') {
      const opt = q.options.find(o => o.key === answered[0]);
      qScore = opt ? opt.score : 0;
    } else {
      answered.forEach(k => {
        const opt = q.options.find(o => o.key === k);
        if (opt) qScore += opt.score;
        if (opt && opt.risk) qScore -= 1;
      });
      qScore = Math.max(0, qScore);
    }
    total += qScore;
    maxTotal += q.maxScore;
    modScores[q.mod].s += qScore;
    modScores[q.mod].m += q.maxScore;
  });
  const pct = maxTotal > 0 ? Math.round((total / maxTotal) * 100) : 0;
  return { total, maxTotal, pct, modScores };
}

function getLevel(pct) { return pct < 40 ? 'red' : pct < 70 ? 'orange' : 'green'; }

const card = document.getElementById('mainCard');

function render() {
  if      (state.screen === 'cover')        renderCover();
  else if (state.screen === 'question')     renderQuestion();
  else if (state.screen === 'leadcapture')  renderLeadCapture();
  else if (state.screen === 'result')       renderResult();
}

function selectVersion(v) { state.version = v; state.answers = {}; renderCover(); }
function startQuiz()       { state.screen = 'question'; state.currentQIdx = 0; render(); }

function selectOption(qId, key, type) {
  if (type === 'single') {
    state.answers[qId] = [key];
  } else {
    let arr = state.answers[qId] || [];
    const idx = arr.indexOf(key);
    if (idx > -1) arr.splice(idx, 1); else arr.push(key);
    state.answers[qId] = arr;
  }
  renderQuestion();
}

function nextQ() {
  if (state.currentQIdx < totalQ() - 1) {
    state.currentQIdx++;
    render();
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    // Fin du quiz → écran de capture
    state.screen = 'leadcapture';
    render();
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function prevQ() {
  if (state.currentQIdx > 0) {
    state.currentQIdx--;
    render();
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function skipLeadCapture() {
  state.leadData = null;
  state.screen = 'result';
  render();
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function restart() {
  state.screen = 'cover';
  state.answers = {};
  state.currentQIdx = 0;
  state.leadData = null;
  render();
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function submitLeadCapture() {
  const nomComplet = document.getElementById('lc_nom_complet').value.trim();
  const commune    = document.getElementById('lc_commune').value.trim();
  const fonction = document.getElementById('lc_fonction').value;
  const consentData       = document.getElementById('lc_consent_data').checked;
  const consentContact    = document.getElementById('lc_consent_contact').checked;
  const consentNewsletter = document.getElementById('lc_consent_newsletter').checked;

  const errorEl   = document.getElementById('lc_error');
  const sendingEl = document.getElementById('lc_sending');
  const submitBtn = document.getElementById('lc_submit_btn');

  // Validation
  if (!nomComplet || !commune) {
    errorEl.textContent = 'Veuillez renseigner votre nom complet et votre commune.';
    errorEl.style.display = 'block';
    return;
  }
  if (!consentData) {
    errorEl.textContent = 'Veuillez cocher la première case pour enregistrer vos données et accéder au rapport.';
    errorEl.style.display = 'block';
    return;
  }
  errorEl.style.display = 'none';

  // Sauvegarde dans le state
  state.leadData = { nomComplet, commune, fonction, consentData, consentContact, consentNewsletter };

  // Envoi vers Power Automate (non-bloquant)
  if (CONFIG.POWER_AUTOMATE_URL) {
    submitBtn.disabled = true;
    sendingEl.style.display = 'block';
    const sc = computeScore();
    try {
      await fetch(CONFIG.POWER_AUTOMATE_URL, {
        method: 'POST',
        mode: 'no-cors', // Power Automate ne renvoie pas de header CORS — comportement normal
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          timestamp:        new Date().toISOString(),
          nomComplet, commune, fonction,
          version:          VERSIONS[state.version].name,
          scorePct:         sc.pct,
          niveau:           getLevel(sc.pct),
          url:              window.location.href,
          consentContact:   consentContact    ? 'oui' : 'non',
          consentNewsletter: consentNewsletter ? 'oui' : 'non',
        }),
      });
    } catch(e) {
      // Silencieux — on ne bloque jamais l'accès aux résultats pour une erreur réseau
      console.warn('[eSignFlow] Envoi Power Automate échoué :', e.message);
    }
    sendingEl.style.display = 'none';
    submitBtn.disabled = false;
  } else {
    // Mode dev — log dans la console
    const sc = computeScore();
    console.log('[eSignFlow Lead]', { nomComplet, commune, fonction, version: state.version, scorePct: sc.pct, niveau: getLevel(sc.pct) });
  }

  state.screen = 'result';
  render();
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderResult() {
  const sc = computeScore(), level = getLevel(sc.pct);
  const levels = {
    red:    { emoji:'🔴', label:'Conformité insuffisante – Risque élevé',        cls:'level-red',    title:'Votre administration est exposée à certains risques de conformité',      subtitle:'Notre diagnostic révèle des lacunes importantes dans votre approche de la signature électronique. Des actions correctrices prioritaires s\'imposent pour vous conformer aux exigences légales et protéger votre administration.' },
    orange: { emoji:'🟠', label:'Maturité intermédiaire – Améliorations nécessaires', cls:'level-orange', title:'De bonnes bases, mais des angles morts à combler',                       subtitle:'Votre administration a pris conscience des enjeux et posé les premières briques. Des améliorations ciblées sur vos processus, votre gouvernance et votre formation vous permettront de franchir un pallier décisif.' },
    green:  { emoji:'🟢', label:'Bonne conformité – Processus solides',           cls:'level-green',  title:'Votre administration montre une vraie culture de la conformité numérique', subtitle:'Vous avez intégré les bonnes pratiques de la signature électronique dans vos processus. Quelques points de vigilance subsistent pour maintenir et renforcer ce niveau d\'excellence opérationnelle.' },
  }[level];

  const deg = Math.round((sc.pct / 100) * 360);
  const scoreColor = level==='red' ? 'var(--red)' : level==='orange' ? 'var(--orange)' : 'var(--green)';
  const modUsed = [...new Set(getQList().map(id => QUESTIONS[id].mod))];

  function getRecos(level) {
    return {
      red: [
        { icon:'⚖️', text:'Il peut être utile de mettre en place une procédure interne sur les niveaux de signature',        sub:'Par exemple, définissez par type de document quel niveau eIDAS s\'applique (simple / avancé / qualifié). Formalisez ce référentiel dans votre règlement intérieur.' },
        { icon:'🚨', text:'Auditer vos marchés publics récents pour identifier les risques de nullité',                        sub:'Les documents signés avec un outil non certifié eIDAS pour des marchés > 30.000€ HTVA peuvent être contestés. Un audit juridique préventif est recommandé.' },
        { icon:'👥', text:'Former en priorité les agents à risque : RH, marchés publics, secrétariat',                         sub:'Une session de 2h sur les bases de la signature électronique réduit considérablement les erreurs les plus coûteuses.' },
        { icon:'🔧', text:'Évaluer et déployer une solution certifiée eIDAS adaptée à vos usages',                            sub:'Priorisez une solution qui couvre vos besoins actuels (contrats, délibérations, marchés) avec une feuille de route claire vers la signature citoyenne.' },
      ],
      orange: [
        { icon:'📋', text:'Formaliser votre politique de délégation de signature',                                             sub:'Un cadre clair sur qui peut signer quoi, dans quelles conditions, protège l\'administration et fluidifie les processus.' },
        { icon:'🗄️', text:'Renforcer votre archivage et la production automatique de journaux de preuve',                    sub:'En cas de contentieux, le journal de preuve horodaté est votre première ligne de défense. Vérifiez que votre outil le génère automatiquement.' },
        { icon:'🔄', text:'Automatiser les workflows de validation documentaire récurrents',                                    sub:'Contrats RH, délibérations, marchés : ces flux prévisibles gagnent à être automatisés pour réduire les délais et les risques d\'erreur.' },
        { icon:'📱', text:'Évaluer l\'ouverture de la signature aux citoyens et aux élus',                                     sub:'La signature à distance via itsme® est une attente croissante des citoyens et permet de moderniser l\'image de votre administration.' },
      ],
      green: [
        { icon:'🏆', text:'Documenter et partager vos bonnes pratiques en interne',                                            sub:'Votre niveau de maturité est au-dessus de la moyenne. Capitalisez sur ces acquis en formalisant vos procédures comme référence interne.' },
        { icon:'🔍', text:'Réaliser un audit annuel de conformité eIDAS',                                                     sub:'La réglementation évolue. Un audit annuel garantit que vos pratiques restent alignées avec le cadre légal européen et belge.' },
        { icon:'🚀', text:'Envisager l\'extension de la signature électronique aux processus citoyens',                       sub:'Si ce n\'est pas encore le cas, la signature citoyenne à distance est la prochaine étape naturelle de votre transformation numérique.' },
        { icon:'🤝', text:'Partager votre expérience avec d\'autres administrations de votre réseau',                         sub:'Les administrations wallonnes progressent plus vite en partageant leurs retours d\'expérience. Par exemple : Les forums Vanden Broele, les Fédérations régionales & provinciales (DF/DG/RR communes et CPAS), les groupements de communes, ...' },
      ],
    }[level];
  }

  const recos = getRecos(level);


  card.innerHTML = `
    <div class="result">
      <div class="result-header">
        <div class="result-level ${levels.cls}">${levels.emoji} ${levels.label}</div>
        <h2 class="result-title">${levels.title}</h2>
        <p class="result-subtitle">${levels.subtitle}</p>
        <div class="score-ring-wrap">
          <div class="score-ring" style="--score-pct:${deg}deg;--score-color:${scoreColor};">
            <div class="score-value">
              <div class="score-num">${sc.pct}%</div>
              <div class="score-max">de conformité</div>
            </div>
          </div>
        </div>
      </div>

      <div class="modules-grid">
        ${modUsed.map(m => {
          const ms = sc.modScores[m];
          const mpct = ms.m > 0 ? Math.round((ms.s / ms.m) * 100) : 0;
          const mcolor = mpct < 40 ? 'var(--red)' : mpct < 70 ? 'var(--orange)' : 'var(--green)';
          return `<div class="mod-result">
            <div class="mod-result-label">${MODULES[m].label}</div>
            <div class="mod-result-name">${MODULES[m].name}</div>
            <div class="mod-bar"><div class="mod-bar-fill" style="width:${mpct}%;background:${mcolor};"></div></div>
            <div class="mod-score-text">${mpct}% · ${ms.s}/${ms.m} pts</div>
          </div>`;
        }).join('')}
      </div>

      <div class="reco-section">
        <h3 class="reco-title">Recommandations prioritaires</h3>
        <div class="reco-list">
          ${recos.map(r => `
            <div class="reco-item">
              <div class="reco-icon">${r.icon}</div>
              <div class="reco-content">
                <div class="reco-text">${r.text}</div>
                <div class="reco-sub">${r.sub}</div>
              </div>
            </div>`).join('')}
        </div>
      </div>

      <div class="cta-block">
        <div class="cta-eyebrow">Solution proposée</div>
        <h3 class="cta-title">eSignFlow — La signature électronique pensée pour les administrations belges</h3>
        <p class="cta-text">Conçue spécifiquement pour les communes belges, les CPAS et les intercommunales, <b>eSignFlow</b> répond aux exigences terrain que ce diagnostic a mis en lumière. Simple d'usage pour les agents, conforme pour les juristes, sécurisée pour l'IT.</p>
        <div class="cta-features">
          <div class="cta-feat"><span class="cta-feat-check">✓</span> Conformité eIDAS & droit belge — niveaux simple, avancé et qualifié</div>
          <div class="cta-feat"><span class="cta-feat-check">✓</span> Intégration itsme® & eID pour les citoyens et les agents</div>
          <div class="cta-feat"><span class="cta-feat-check">✓</span> Workflows internes, délégation de signature, signature en masse</div>
          <div class="cta-feat"><span class="cta-feat-check">✓</span> Journal de preuve automatique & archivage conforme AGR</div>
          <div class="cta-feat"><span class="cta-feat-check">✓</span> Hébergement RGPD en Belgique — aucune donnée hors UE</div>
        </div>
        <div class="cta-actions">
          <a href="https://www.esignflow.be/fr-be/" target="_blank" class="btn-gold">En savoir plus →</a>
          <button class="btn-pdf" id="btn-pdf-download" onclick="downloadPDF()">
            ⬇ Télécharger mon rapport PDF
          </button>
        </div>

        <div class="demo-section">
          <div class="demo-label">📅 Demander une démonstration — Contactez votre commercial</div>
          <div class="commercial-cards">
            <div class="commercial-card">
              <div class="commercial-info">
                <img class="commercial-photo" src="https://media.licdn.com/dms/image/v2/C5603AQHtbu4RKZjkqA/profile-displayphoto-shrink_800_800/profile-displayphoto-shrink_800_800/0/1517496169498?e=1775088000&v=beta&t=EnOJJJW0XEnruNIjcJJ3cmw-NnhN_5brxG_6cXnLITo" alt="Lisa D'Angelo" onerror="this.style.display='none'">
                <div>
                  <div class="commercial-name">Lisa D'Angelo</div>
                  <div class="commercial-title">Account manager</div>
                </div>
              </div>
              <div class="commercial-territory">Provinces de Liège, Luxembourg &amp; Namur</div>
              <a href="mailto:lisa.dangelo@vandenbroele.be" class="btn-demo-contact">Contacter Lisa →</a>
            </div>
            <div class="commercial-card">
              <div class="commercial-info">
                <img class="commercial-photo" src="https://media.licdn.com/dms/image/v2/D4E03AQHaBmlyg5HbAg/profile-displayphoto-crop_800_800/B4EZxHcTZAKoAM-/0/1770725131065?e=1775088000&v=beta&t=HF4UZP9cM2k4TFlkjZN_xUAGgRjlaXeDesiD1bRGZik" alt="Jérome Sulbout" onerror="this.style.display='none'">
                <div>
                  <div class="commercial-name">Jérome Sulbout</div>
                  <div class="commercial-title">Account manager</div>
                </div>
              </div>
              <div class="commercial-territory">Hainaut, Namur, Brabant Wallon &amp; Bruxelles</div>
              <a href="mailto:jerome.sulbout@vandenbroele.be" class="btn-demo-contact">Contacter Jérome →</a>
            </div>
          </div>
        </div>
      </div>

      <div class="result-restart">
        <button class="btn-text" onclick="restart()">↩ Recommencer avec une autre version</button>
      </div>
    </div>`;

  setTimeout(() => {
    document.querySelectorAll('.mod-bar-fill').forEach(el => {
      const w = el.style.width;
      el.style.width = '0';
      setTimeout(() => el.style.width = w, 50);
    });
  }, 100);
}

// ══════════════════════════════════════════════════
// GÉNÉRATION PDF — sans window.print(), compatible iFrame cross-origin
// ══════════════════════════════════════════════════
function downloadPDF() {
  const btn = document.getElementById('btn-pdf-download');
  if (btn) { btn.disabled = true; btn.textContent = 'Génération en cours…'; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

  const sc    = computeScore();
  const level = getLevel(sc.pct);
  const levelLabels = { red: 'Conformité insuffisante – Risque élevé', orange: 'Maturité intermédiaire – Améliorations nécessaires', green: 'Bonne conformité – Processus solides' };
  const levelColors = { red: [220,38,38], orange: [234,88,12], green: [22,163,74] };
  const modUsed = [...new Set(getQList().map(id => QUESTIONS[id].mod))];
  const contact = state.leadData;

  const W = 210, M = 18; // largeur A4, marge
  let y = 0;

  // Fonctions utilitaires
  const setFont = (style, size, color) => {
    doc.setFont('helvetica', style);
    doc.setFontSize(size);
    doc.setTextColor(...(color || [26,26,46]));
  };
  const line = (x1, y1, x2, y2, color, lw) => {
    doc.setDrawColor(...(color || [220,215,205]));
    doc.setLineWidth(lw || 0.3);
    doc.line(x1, y1, x2, y2);
  };
  const box = (x, bY, w, h, fill, stroke) => {
    if (fill)   { doc.setFillColor(...fill);   }
    if (stroke) { doc.setDrawColor(...stroke); doc.setLineWidth(0.3); }
    doc.roundedRect(x, bY, w, h, 3, 3, fill && stroke ? 'FD' : fill ? 'F' : 'D');
  };
  const wrap = (text, x, wY, maxW) => {
    const lines = doc.splitTextToSize(text, maxW);
    doc.text(lines, x, wY);
    return lines.length;
  };

  // ── En-tête ──
  box(0, 0, W, 42, [13,31,60]);
  // Bande accent
  doc.setFillColor(70,128,247);
  doc.rect(0, 40, W, 2, 'F');
  // Logo texte
  setFont('bold', 18, [255,255,255]);
  doc.text('eSignFlow', M, 16);
  setFont('normal', 9, [107,154,255]);
  doc.text('Diagnostic Signature Électronique', M, 23);
  setFont('normal', 8, [180,200,240]);
  doc.text('Vanden Broele · ' + new Date().toLocaleDateString('fr-BE', { day:'2-digit', month:'long', year:'numeric' }), M, 30);
  // Score badge (coin droit)
  const scoreCol = levelColors[level];
  doc.setFillColor(255,255,255);
  doc.circle(W - M - 8, 20, 14, 'F');
  setFont('bold', 18, scoreCol);
  doc.text(sc.pct + '%', W - M - 8, 18, { align: 'center' });
  setFont('normal', 7, scoreCol);
  doc.text('conformité', W - M - 8, 24, { align: 'center' });

  y = 52;

  // ── Contact (si disponible) ──
  if (contact && contact.nomComplet) {
    setFont('bold', 9, [90,99,122]);
    doc.text('RAPPORT ÉTABLI POUR', M, y);
    y += 5;
    setFont('bold', 12, [13,31,60]);
    doc.text(contact.nomComplet, M, y);
    y += 5;
    setFont('normal', 9, [90,99,122]);
    if (contact.fonction)      doc.text(contact.fonction, M, y), y += 4.5;
    if (contact.administration) doc.text(contact.administration, M, y), y += 4.5;
    if (contact.typeOrganisme)  doc.text(contact.typeOrganisme, M, y), y += 4.5;
    line(M, y + 1, W - M, y + 1);
    y += 7;
  }

  // ── Niveau global ──
  box(M, y, W - 2*M, 18, [...levelColors[level].map(c => Math.min(255, c + 210))]);
  doc.setFillColor(...levelColors[level]);
  doc.roundedRect(M, y, 4, 18, 1, 1, 'F');
  setFont('bold', 10, levelColors[level]);
  doc.text(levelLabels[level], M + 8, y + 7);
  setFont('normal', 8, [60,60,80]);
  const versionName = VERSIONS[state.version].name;
  doc.text(`Version ${versionName} · ${totalQ()} questions · Score ${sc.total}/${sc.maxTotal} pts`, M + 8, y + 13);
  y += 26;

  // ── Scores par module ──
  setFont('bold', 10, [13,31,60]);
  doc.text('RÉSULTATS PAR MODULE', M, y);
  line(M, y + 2, W - M, y + 2, [70,128,247], 0.5);
  y += 8;

  const colW = (W - 2*M - 6) / 2;
  let col = 0;
  modUsed.forEach(m => {
    const ms  = sc.modScores[m];
    const pct = ms.m > 0 ? Math.round((ms.s / ms.m) * 100) : 0;
    const col2 = levelColors[pct < 40 ? 'red' : pct < 70 ? 'orange' : 'green'];
    const xOff = M + col * (colW + 6);

    box(xOff, y, colW, 22, [250,249,246], [220,215,205]);
    setFont('bold', 7, [90,99,122]);
    doc.text(MODULES[m].label.toUpperCase(), xOff + 4, y + 6);
    setFont('bold', 8, [13,31,60]);
    doc.text(MODULES[m].name, xOff + 4, y + 11);
    // Barre de progression
    const barX = xOff + 4, barY = y + 15, barW = colW - 8, barH = 3;
    box(barX, barY, barW, barH, [220,215,205]);
    if (pct > 0) box(barX, barY, barW * pct / 100, barH, col2);
    setFont('normal', 7, col2);
    doc.text(`${pct}% · ${ms.s}/${ms.m} pts`, xOff + colW - 4, y + 18, { align: 'right' });

    col++;
    if (col === 2) { col = 0; y += 26; }
  });
  if (col === 1) y += 26;
  y += 6;

  // ── Recommandations ──
  // (Même logique que getRecos dans renderResult)
  const recoSets = {
    red: [
      { icon:'⚖', text:'Mettre en place une procédure interne sur les niveaux de signature', sub:'Définissez par type de document quel niveau eIDAS s\'applique. Formalisez ce référentiel dans votre règlement intérieur.' },
      { icon:'!',  text:'Auditer vos marchés publics récents pour identifier les risques de nullité', sub:'Les documents signés sans outil certifié eIDAS pour des marchés > 30.000€ HTVA peuvent être contestés.' },
      { icon:'👥', text:'Former en priorité les agents à risque : RH, marchés publics, secrétariat', sub:'Une session de 2h réduit considérablement les erreurs les plus coûteuses.' },
      { icon:'⚙', text:'Évaluer et déployer une solution certifiée eIDAS adaptée à vos usages', sub:'Priorisez une solution couvrant vos besoins actuels avec une feuille de route claire.' },
    ],
    orange: [
      { icon:'📋', text:'Formaliser votre politique de délégation de signature', sub:'Un cadre clair sur qui peut signer quoi protège l\'administration et fluidifie les processus.' },
      { icon:'🗄', text:'Renforcer votre archivage et les journaux de preuve automatiques', sub:'Le journal de preuve horodaté est votre première ligne de défense en cas de contentieux.' },
      { icon:'🔄', text:'Automatiser les workflows de validation documentaire récurrents', sub:'Contrats RH, délibérations, marchés : ces flux gagnent à être automatisés.' },
      { icon:'📱', text:'Évaluer l\'ouverture de la signature aux citoyens et aux élus', sub:'La signature via itsme® modernise l\'image de votre administration.' },
    ],
    green: [
      { icon:'🏆', text:'Documenter et partager vos bonnes pratiques en interne', sub:'Votre niveau est au-dessus de la moyenne. Formalisez vos procédures comme référence.' },
      { icon:'🔍', text:'Réaliser un audit annuel de conformité eIDAS', sub:'La réglementation évolue. Un audit annuel garantit l\'alignement avec le cadre légal.' },
      { icon:'🚀', text:'Étendre la signature électronique aux processus citoyens', sub:'La signature citoyenne à distance est la prochaine étape naturelle.' },
      { icon:'🤝', text:'Partager votre expérience avec d\'autres administrations', sub:'Les forums Vanden Broele et les fédérations régionales sont d\'excellents vecteurs.' },
    ],
  };
  const recos = recoSets[level];

  // Vérif saut de page
  if (y > 220) { doc.addPage(); y = 18; }

  setFont('bold', 10, [13,31,60]);
  doc.text('RECOMMANDATIONS PRIORITAIRES', M, y);
  line(M, y + 2, W - M, y + 2, [70,128,247], 0.5);
  y += 9;

  recos.forEach((r, i) => {
    if (y > 255) { doc.addPage(); y = 18; }
    // Numéro
    doc.setFillColor(70,128,247);
    doc.circle(M + 3, y + 1, 3.5, 'F');
    setFont('bold', 8, [255,255,255]);
    doc.text(String(i + 1), M + 3, y + 2.5, { align:'center' });
    // Texte
    setFont('bold', 9, [13,31,60]);
    const nL = wrap(r.text, M + 10, y + 2, W - M - 24);
    setFont('normal', 8, [90,99,122]);
    const subLines = doc.splitTextToSize(r.sub, W - M - 24);
    doc.text(subLines, M + 10, y + 2 + nL * 4.2);
    y += 6 + nL * 4.2 + subLines.length * 3.8 + 3;
    line(M + 10, y - 1.5, W - M, y - 1.5, [220,215,205], 0.2);
  });

  y += 6;

  // ── Bloc CTA eSignFlow ──
  if (y > 240) { doc.addPage(); y = 18; }
  box(M, y, W - 2*M, 38, [13,31,60]);
  doc.setFillColor(70,128,247);
  doc.rect(M, y, 4, 38, 'F');
  setFont('bold', 11, [255,255,255]);
  doc.text('eSignFlow par Vanden Broele', M + 8, y + 9);
  setFont('normal', 8, [180,200,240]);
  const ctaLines = doc.splitTextToSize('Solution de signature électronique conçue pour les communes belges, CPAS et intercommunales. Conforme eIDAS, intégration itsme® & eID, hébergement RGPD en Belgique.', W - 2*M - 14);
  doc.text(ctaLines, M + 8, y + 16);
  setFont('bold', 9, [107,154,255]);
  doc.text('www.esignflow.be', M + 8, y + 32);

  // ── Pied de page ──
  const totalPages = doc.getNumberOfPages();
  for (let p = 1; p <= totalPages; p++) {
    doc.setPage(p);
    line(M, 284, W - M, 284, [200,195,185], 0.3);
    setFont('normal', 7, [150,155,165]);
    doc.text('Diagnostic eSignFlow · Vanden Broele · Outil non contractuel · Conforme RGPD', M, 289);
    doc.text(`Page ${p} / ${totalPages}`, W - M, 289, { align: 'right' });
  }

  // Téléchargement
  const dateStr = new Date().toISOString().slice(0,10);
  const orgSlug = (contact && contact.administration)
    ? contact.administration.replace(/\s+/g,'-').toLowerCase().slice(0,30) + '_'
    : '';
  doc.save(`rapport-esignflow_${orgSlug}${dateStr}.pdf`);

  if (btn) { btn.disabled = false; btn.innerHTML = '⬇ Télécharger mon rapport PDF'; }
}

// ══════════════════════════════════════════════════
// EXPOSITION GLOBALE & INIT
// ══════════════════════════════════════════════════
window.selectVersion    = selectVersion;
window.startQuiz        = startQuiz;
window.selectOption     = selectOption;
window.nextQ            = nextQ;
window.prevQ            = prevQ;
window.restart          = restart;
window.skipLeadCapture   = skipLeadCapture;
window.submitLeadCapture  = submitLeadCapture;
window.downloadPDF      = downloadPDF;

render();
</script>
