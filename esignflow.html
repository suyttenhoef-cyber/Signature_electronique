<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostic Signature Électronique – Administrations publiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;0,800;1,300&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1f3c;
    --navy-light: #152c52;
    --brand: #4680F7;         /* nouvelle couleur branding */
    --brand-light: #6b9aff;   /* déclinaison plus claire */
    --gold: #e8a020;
    --gold-light: #f5c45a;
    --cream: #f7f4ef;
    --cream-dark: #ede8df;
    --text: #1a1a2e;
    --text-muted: #5a637a;
    --white: #ffffff;
    --red: #dc2626;
    --orange: #ea580c;
    --green: #16a34a;
    --radius: 16px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(13,31,60,0.12);
    --shadow-lg: 0 12px 48px rgba(13,31,60,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Montserrat', sans-serif;  /* police principale modifiée */
    background: var(--navy);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Background ── */
  .bg-pattern {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 20% 20%, rgba(70,128,247,0.18) 0%, transparent 60%),  /* brand #4680F7 */
      radial-gradient(ellipse 50% 60% at 80% 80%, rgba(232,160,32,0.12) 0%, transparent 60%),
      var(--navy);
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  /* ── Layout ── */
  .app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 16px 60px; }

  /* ── Top Bar (logo vectoriel) ── */
  .topbar {
    width: 100%; max-width: 860px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 0 32px;
  }
  .logo svg {
    display: block;
    height: 40px;               /* hauteur confortable */
    width: auto;
    fill: none;                 /* le svg gère ses couleurs */
  }
  .badge-secure {
    font-size: 11px; color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.15);
    padding: 4px 12px; border-radius: 20px; letter-spacing: 0.5px;
    font-family: 'Montserrat', sans-serif;
  }

  /* ── Card ── */
  .card {
    width: 100%; max-width: 860px;
    background: var(--cream);
    border-radius: 24px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Progress Bar (brand) ── */
  .progress-bar-wrap {
    height: 5px; background: var(--cream-dark); position: relative;
  }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--brand), var(--gold));
    transition: width 0.6s cubic-bezier(0.22,1,0.36,1);
    border-radius: 0 3px 3px 0;
  }

  /* ── Module Label (brand dot) ── */
  .module-label {
    display: flex; align-items: center; gap: 10px;
    padding: 20px 36px 0;
    font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--text-muted);
    font-family: 'Montserrat', sans-serif;
  }
  .module-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brand), var(--gold));
  }

  /* ── Question Body ── */
  .q-body { padding: 24px 36px 36px; }
  .q-number { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-bottom: 8px; font-family: 'Montserrat', sans-serif; }
  .q-title {
    font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 22px;
    line-height: 1.4; color: var(--navy); margin-bottom: 8px;
  }
  .q-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; line-height: 1.6; font-family: 'Montserrat', sans-serif; }

  /* ── Scenario Box (brand accent) ── */
  .scenario-box {
    background: var(--navy); color: white; border-radius: 12px;
    padding: 20px 24px; margin-bottom: 24px; position: relative; overflow: hidden;
  }
  .scenario-box::before {
    content: '"'; font-family: 'Montserrat', sans-serif; font-size: 80px; color: var(--brand-light); /* #6b9aff */
    opacity: 0.2; position: absolute; top: -10px; left: 16px; line-height: 1;
  }
  .scenario-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--brand-light); margin-bottom: 8px; font-weight: 600; }
  .scenario-text { font-size: 14px; line-height: 1.7; color: rgba(255,255,255,0.85); font-family: 'Montserrat', sans-serif; }

  /* ── Options (brand selected) ── */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 16px 20px; border-radius: 12px;
    background: white; border: 2px solid transparent;
    cursor: pointer; transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(13,31,60,0.06);
  }
  .option:hover { border-color: var(--brand-light); transform: translateX(4px); }
  .option.selected { border-color: var(--brand); background: #eef3ff; }
  .option.correct { border-color: var(--green); background: #f0fdf4; }
  .option.risky { border-color: var(--orange); background: #fff7ed; }
  .option-key {
    width: 28px; height: 28px; min-width: 28px; border-radius: 8px;
    background: var(--cream-dark); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--text-muted);
    transition: all 0.2s; font-family: 'Montserrat', sans-serif;
  }
  .option.selected .option-key { background: var(--brand); color: white; }
  .option-content { flex: 1; }
  .option-text { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.5; font-family: 'Montserrat', sans-serif; }
  .option-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; font-family: 'Montserrat', sans-serif; }

  /* ── Multi-select ── */
  .multi-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; font-style: italic; font-family: 'Montserrat', sans-serif; }

  /* ── Info Tip (brand border) ── */
  .info-tip {
    margin-top: 20px; padding: 14px 18px;
    background: linear-gradient(135deg, rgba(70,128,247,0.08), rgba(232,160,32,0.06));
    border-left: 3px solid var(--brand); border-radius: 0 8px 8px 0;
    font-size: 13px; color: var(--text-muted); line-height: 1.6;
    font-family: 'Montserrat', sans-serif;
  }
  .info-tip strong { color: var(--navy); }

  /* ── Navigation ── */
  .q-nav {
    padding: 0 36px 32px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .btn {
    padding: 12px 28px; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; border: none; transition: all 0.2s ease; font-family: 'Montserrat', sans-serif;
  }
  .btn-primary {
    background: var(--navy); color: white;
    box-shadow: 0 4px 16px rgba(13,31,60,0.2);
  }
  .btn-primary:hover { background: var(--navy-light); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(13,31,60,0.3); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-secondary { background: transparent; color: var(--text-muted); }
  .btn-secondary:hover { color: var(--navy); }
  .step-counter { font-size: 13px; color: var(--text-muted); font-family: 'Montserrat', sans-serif; }

  /* ── Cover Screen (brand accent) ── */
  .cover { padding: 48px 36px 40px; }
  .cover-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700;
    color: var(--brand); margin-bottom: 20px;
    background: rgba(70,128,247,0.08); padding: 6px 14px; border-radius: 20px;
    font-family: 'Montserrat', sans-serif;
  }
  .cover-title {
    font-family: 'Montserrat', sans-serif; font-size: 32px; font-weight: 800; color: var(--navy);
    line-height: 1.2; margin-bottom: 16px;
  }
  .cover-title em { font-style: italic; color: var(--brand); }
  .cover-lead { font-size: 16px; color: var(--text-muted); line-height: 1.7; margin-bottom: 32px; max-width: 100%; font-family: 'Montserrat', sans-serif; }
  .cover-features { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 36px; }
  .cover-feat {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text); font-weight: 500;
    background: white; padding: 8px 16px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(13,31,60,0.07);
    font-family: 'Montserrat', sans-serif;
  }
  .cover-feat-icon { font-size: 16px; }
  .version-selector { margin-bottom: 32px; }
  .version-title { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.8px; font-family: 'Montserrat', sans-serif; }
  .version-cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .ver-card {
    flex: 1; min-width: 160px; padding: 16px; border-radius: 12px;
    background: white; border: 2px solid var(--cream-dark); cursor: pointer;
    transition: all 0.2s; text-align: center;
  }
  .ver-card:hover { border-color: var(--brand-light); }
  .ver-card.active { border-color: var(--brand); background: #eef3ff; }
  .ver-icon { font-size: 24px; margin-bottom: 6px; }
  .ver-name { font-weight: 700; font-size: 14px; color: var(--navy); font-family: 'Montserrat', sans-serif; }
  .ver-time { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-family: 'Montserrat', sans-serif; }
  .cover-disclaimer { font-size: 12px; color: var(--text-muted); margin-top: 20px; font-family: 'Montserrat', sans-serif; }

  /* ── Result Screen (brand used) ── */
  .result { padding: 40px 36px; }
  .result-header { text-align: center; margin-bottom: 40px; }
  .result-level {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    padding: 8px 20px; border-radius: 20px; margin-bottom: 20px;
    font-family: 'Montserrat', sans-serif;
  }
  .level-red { background: #fef2f2; color: var(--red); }
  .level-orange { background: #fff7ed; color: var(--orange); }
  .level-green { background: #f0fdf4; color: var(--green); }
  .result-title { font-family: 'Montserrat', sans-serif; font-size: 30px; font-weight: 800; color: var(--navy); margin-bottom: 12px; line-height: 1.3; }
  .result-subtitle { font-size: 15px; color: var(--text-muted); line-height: 1.7; max-width: 560px; margin: 0 auto; font-family: 'Montserrat', sans-serif; }

  /* Score Ring */
  .score-ring-wrap { display: flex; justify-content: center; margin: 32px 0; }
  .score-ring {
    width: 140px; height: 140px; border-radius: 50%;
    background: conic-gradient(var(--score-color, var(--brand)) var(--score-pct, 0deg), var(--cream-dark) 0deg);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .score-ring::after {
    content: ''; position: absolute; width: 104px; height: 104px;
    background: var(--cream); border-radius: 50%;
  }
  .score-value {
    position: relative; z-index: 1; text-align: center;
  }
  .score-num { font-family: 'Montserrat', sans-serif; font-size: 36px; font-weight: 800; color: var(--navy); line-height: 1; }
  .score-max { font-size: 12px; color: var(--text-muted); font-family: 'Montserrat', sans-serif; }

  /* Modules Result */
  .modules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 32px 0; }
  @media(max-width:600px){ .modules-grid { grid-template-columns: 1fr; } }
  .mod-result {
    background: white; border-radius: 12px; padding: 20px;
    box-shadow: 0 2px 12px rgba(13,31,60,0.07);
  }
  .mod-result-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; font-family: 'Montserrat', sans-serif; }
  .mod-result-name { font-weight: 700; font-size: 15px; color: var(--navy); margin-bottom: 12px; font-family: 'Montserrat', sans-serif; }
  .mod-bar { height: 6px; background: var(--cream-dark); border-radius: 3px; overflow: hidden; }
  .mod-bar-fill { height: 100%; border-radius: 3px; transition: width 1s cubic-bezier(0.22,1,0.36,1); }
  .mod-score-text { font-size: 12px; color: var(--text-muted); margin-top: 6px; font-family: 'Montserrat', sans-serif; }

  /* Recommendations */
  .reco-section { margin: 32px 0; }
  .reco-title { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 600; color: var(--navy); margin-bottom: 20px; }
  .reco-list { display: flex; flex-direction: column; gap: 12px; }
  .reco-item {
    display: flex; gap: 14px; align-items: flex-start;
    background: white; border-radius: 12px; padding: 16px 20px;
    box-shadow: 0 2px 8px rgba(13,31,60,0.06);
  }
  .reco-icon { font-size: 20px; min-width: 24px; margin-top: 1px; }
  .reco-content {}
  .reco-text { font-size: 14px; color: var(--text); line-height: 1.6; font-weight: 500; font-family: 'Montserrat', sans-serif; }
  .reco-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; font-family: 'Montserrat', sans-serif; }

  /* CTA (brand enhanced) */
  .cta-block {
    background: var(--navy); border-radius: 16px; padding: 32px;
    margin: 32px 0; color: white; position: relative; overflow: hidden;
  }
  .cta-block::after {
    content: ''; position: absolute; right: -30px; top: -30px;
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(70,128,247,0.2), transparent); /* brand */
  }
  .cta-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--brand-light); margin-bottom: 12px; font-weight: 600; font-family: 'Montserrat', sans-serif; }
  .cta-title { font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 600; margin-bottom: 12px; line-height: 1.3; }
  .cta-text { font-size: 14px; color: rgba(255,255,255,0.75); line-height: 1.7; margin-bottom: 24px; max-width: 480px; font-family: 'Montserrat', sans-serif; }
  .cta-features { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .cta-feat { display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgba(255,255,255,0.85); font-family: 'Montserrat', sans-serif; }
  .cta-feat-check { color: var(--brand-light); font-weight: 700; } /* #6b9aff */
  .cta-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--navy);
    font-weight: 700; padding: 12px 24px; border-radius: 10px; font-size: 14px;
    cursor: pointer; border: none; font-family: 'Montserrat', sans-serif;
    transition: all 0.2s; text-decoration: none; display: inline-block;
  }
  .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232,160,32,0.3); }
  .btn-outline-white {
    background: transparent; color: white; border: 1.5px solid rgba(255,255,255,0.3);
    padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'Montserrat', sans-serif;
    transition: all 0.2s; text-decoration: none; display: inline-block;
  }
  .btn-outline-white:hover { border-color: white; background: rgba(255,255,255,0.05); }

  /* ── Commercial Cards ── */
  .demo-section { margin-top: 28px; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 24px; }
  .demo-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--brand-light);
    font-weight: 600; font-family: 'Montserrat', sans-serif; margin-bottom: 16px;
  }
  .commercial-cards { display: flex; gap: 14px; flex-wrap: wrap; }
  .commercial-card {
    flex: 1; min-width: 220px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px;
    transition: all 0.2s;
  }
  .commercial-card:hover { background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.25); transform: translateY(-2px); }
  .commercial-info { display: flex; align-items: center; gap: 14px; }
  .commercial-photo {
    width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
    border: 2.5px solid rgba(70,128,247,0.5); flex-shrink: 0;
  }
  .commercial-name { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 15px; color: white; margin-bottom: 2px; }
  .commercial-title { font-size: 11px; color: var(--brand-light); font-weight: 600; font-family: 'Montserrat', sans-serif; }
  .commercial-territory {
    font-size: 12px; color: rgba(255,255,255,0.6); font-family: 'Montserrat', sans-serif;
    line-height: 1.5; display: flex; gap: 7px; align-items: flex-start;
  }
  .commercial-territory::before { content: '📍'; font-size: 13px; flex-shrink: 0; margin-top: 0px; }
  .btn-demo-contact {
    display: block; text-align: center; background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--navy); font-weight: 700; padding: 10px 16px; border-radius: 8px;
    font-size: 13px; font-family: 'Montserrat', sans-serif; text-decoration: none;
    transition: all 0.2s; border: none; cursor: pointer; width: 100%;
  }
  .btn-demo-contact:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(232,160,32,0.35); }
  .result-restart { text-align: center; margin-top: 24px; }
  .btn-text { background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; text-decoration: underline; font-family: 'Montserrat', sans-serif; }

  /* ── Legal strip ── */
  .legal-strip {
    margin-top: 40px; font-size: 11px; color: rgba(255,255,255,0.3);
    text-align: center; line-height: 1.8;
    font-family: 'Montserrat', sans-serif;
  }
  .legal-strip a { color: rgba(255,255,255,0.4); }

  /* ── Responsive ── */
  @media(max-width: 640px){
    .cover { padding: 32px 20px 28px; }
    .q-body { padding: 20px 20px 28px; }
    .q-nav { padding: 0 20px 24px; }
    .module-label { padding: 16px 20px 0; }
    .cover-title { font-size: 26px; }
    .q-title { font-size: 18px; }
    .result { padding: 28px 20px; }
    .cta-block { padding: 24px 20px; }
    .logo svg { height: 32px; }
  }
</style>
</head>
<body>
<div class="bg-pattern"></div>
<div class="bg-grid"></div>

<div class="app">
  <div class="topbar">
    <div class="logo">
      <!-- Logo officiel eSignFlow (format inversé pour fond bleu) -->
      <img src="https://www.esignflow.be/img/esignflow-inverted-logo-baseline-FR.svg" 
           alt="eSignFlow" 
           style="height: 40px; width: auto; display: block;">
    </div>
    <div class="badge-secure">🔒 Données non stockées</div>
  </div>

  <div class="card" id="mainCard"></div>

  <div class="legal-strip">
    Outil de diagnostic non contractuel · Conforme eIDAS &amp; RGPD · <a href="https://www.esignflow.be/fr-be" target="_blank">esignflow.be</a>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════
// DATA (identique à l'original, gardé pour cohérence)
// ══════════════════════════════════════════════════
const VERSIONS = {
  court: { name: 'Rapide', icon: '⚡', time: '5 min', description: 'Essentiel', qIds: ['A1','A3','B2','C1','D1'] },
  standard: { name: 'Standard', icon: '📋', time: '8–10 min', description: 'Complet & équilibré', qIds: ['A1','A2','A3','B1','B2','B3','C1','C2','D1','D2'] },
  premium: { name: 'Premium', icon: '🏛️', time: '15–20 min', description: 'Scénarios immersifs', qIds: ['A1','A2','A3','A4','B1','B2','B3','B4','C1','C2','C3','D1','D2','D3'] }
};

const MODULES = {
  A: { label: 'Partie 1', name: 'Conformité légale & eIDAS', color: '#4680F7' }, // brand
  B: { label: 'Partie 2', name: 'Processus internes & validation', color: '#7c3aed' },
  C: { label: 'Partie 3', name: 'Sécurité & gestion du risque', color: '#dc2626' },
  D: { label: 'Partie 4', name: 'Maturité numérique', color: '#16a34a' },
};

const QUESTIONS = {
  A1: {
    mod: 'A', number: 'A–01',
    title: 'Quelle valeur juridique attribuez-vous aux documents signés électroniquement dans votre administration ?',
    subtitle: 'Cette question évalue votre compréhension du cadre réglementaire eIDAS et de ses implications pratiques.',

// STATE & FONCTIONS (inchangés)
// ══════════════════════════════════════════════════
let state = { screen: 'cover', version: 'standard', currentQIdx: 0, answers: {} };

function getQList() { return VERSIONS[state.version].qIds; }
function totalQ() { return getQList().length; }
function currentQId() { return getQList()[state.currentQIdx]; }

function computeScore() {
  let total = 0, maxTotal = 0;
  const modScores = { A:{s:0,m:0}, B:{s:0,m:0}, C:{s:0,m:0}, D:{s:0,m:0} };
  getQList().forEach(qId => {
    const q = QUESTIONS[qId];
    const answered = state.answers[qId] || [];
    let qScore = 0;
    if (q.type === 'single') {
      const ans = answered[0];
      const opt = q.options.find(o=>o.key===ans);
      qScore = opt ? opt.score : 0;
    } else {
      answered.forEach(k => {
        const opt = q.options.find(o=>o.key===k);
        if(opt) qScore += opt.score;
        if(opt && opt.risk) qScore -= 1;
      });
      qScore = Math.max(0, qScore);
    }
    total += qScore;
    maxTotal += q.maxScore;
    modScores[q.mod].s += qScore;
    modScores[q.mod].m += q.maxScore;
  });
  const pct = maxTotal > 0 ? Math.round((total/maxTotal)*100) : 0;
  return { total, maxTotal, pct, modScores };
}

function getLevel(pct) { return pct<40?'red':pct<70?'orange':'green'; }

const card = document.getElementById('mainCard');
function render() {
  if(state.screen==='cover') renderCover();
  else if(state.screen==='question') renderQuestion();
  else if(state.screen==='result') renderResult();
}

// fonctions de rendu (identiques mais adaptées au branding via CSS)
function selectVersion(v) { state.version=v; state.answers={}; renderCover(); }
function startQuiz() { state.screen='question'; state.currentQIdx=0; render(); }
function selectOption(qId,key,type) {
  if(type==='single') state.answers[qId]=[key];
  else {
    let arr=state.answers[qId]||[];
    let idx=arr.indexOf(key);
    if(idx>-1) arr.splice(idx,1); else arr.push(key);
    state.answers[qId]=arr;
  }
  renderQuestion();
}
function nextQ() {
  if(state.currentQIdx<totalQ()-1) { state.currentQIdx++; render(); card.scrollIntoView({behavior:'smooth',block:'start'}); }
  else { state.screen='result'; render(); card.scrollIntoView({behavior:'smooth',block:'start'}); }
}
function prevQ() { if(state.currentQIdx>0){state.currentQIdx--; render(); card.scrollIntoView({behavior:'smooth',block:'start'});} }
function restart() { state.screen='cover'; state.answers={}; state.currentQIdx=0; render(); card.scrollIntoView({behavior:'smooth',block:'start'}); }

  const qId=currentQId(), q=QUESTIONS[qId], qList=getQList(), pct=Math.round(((state.currentQIdx)/(totalQ()))*100);
  const answered=state.answers[qId]||[], mod=MODULES[q.mod], canNext=answered.length>0;

function renderResult() {
  const sc=computeScore(), level=getLevel(sc.pct), levels={red:{emoji:'🔴',label:'Conformité insuffisante – Risque élevé',cls:'level-red',title:'Votre administration est exposée à certains risques de conformité',subtitle:'Notre diagnostic révèle des lacunes importantes dans votre approche de la signature électronique. Des actions correctrices prioritaires s\'imposent pour vous conformer aux exigences légales et protéger votre administration.'},orange:{emoji:'🟠',label:'Maturité intermédiaire – Améliorations nécessaires',cls:'level-orange',title:'De bonnes bases, mais des angles morts à combler',subtitle:'Votre administration a pris conscience des enjeux et posé les premières briques. Des améliorations ciblées sur vos processus, votre gouvernance et votre formation vous permettront de franchir un pallier décisif.'},green:{emoji:'🟢',label:'Bonne conformité – Processus solides',cls:'level-green',title:'Votre administration montre une vraie culture de la conformité numérique',subtitle:'Vous avez intégré les bonnes pratiques de la signature électronique dans vos processus. Quelques points de vigilance subsistent pour maintenir et renforcer ce niveau d\'excellence opérationnelle.'}}[level];
